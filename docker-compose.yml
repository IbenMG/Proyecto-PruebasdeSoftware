services:
  db:
    image: postgres:16-alpine
    container_name: crowdstarter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crowdstarter
      POSTGRES_USER: masteruser
      POSTGRES_PASSWORD: "12345678"
    ports:
      - "5433:5432"
    volumes:
      - crowdstarter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masteruser -d crowdstarter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crowdstarter_pgdata:
    name: crowdstarter_pgdata
